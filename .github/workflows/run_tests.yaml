name: Run Tests
run-name: ${{ github.actor }} is ${{ github.workflow }} ${{ vars.PROJECT_DIR_NAME }}
on:
  push:
    branches: [develop, tests]
jobs:
  Tests:
    strategy:
      matrix:
        include:
          - os: Windows
            runs-on: [self-hosted, Windows]
            condition: ${{ vars.ENABLE_WINDOWS_RUNNER == 'true' }}
          - os: macOS
            runs-on: [self-hosted, macOS]
            condition: ${{ vars.ENABLE_MACOS_RUNNER == 'true' }}
    runs-on: ${{ matrix.runs-on }}
    if: ${{ matrix.condition == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          clean: false

      - name: PlayMode Tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          "${{ vars.PROJECT_DIR_NAME && format('{0}\', vars.PROJECT_DIR_NAME) }}tools\cicd\tests\run_tests.bat" PlayMode Project.Tests

      - name: PlayMode Tests (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          "${{ vars.PROJECT_DIR_NAME && format('{0}/', vars.PROJECT_DIR_NAME) }}tools/cicd/tests/run_testscommand" PlayMode Project.Tests

