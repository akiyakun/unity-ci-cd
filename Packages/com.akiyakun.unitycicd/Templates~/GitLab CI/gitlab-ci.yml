# GitLab CI/CD テンプレート（Windows の shell Runner で PlayMode テストを実行する）
# 使い方: リポジトリ直下に .gitlab-ci.yml としてコピーし、PROJECT_DIR_NAME とタグを合わせる。
# 前提: Runner は shell（pwsh）executor、Unity をライセンス認証したユーザーでサービスとして動かす。
stages:
  - test

variables:
  # Unity プロジェクトのフォルダ（リポジトリ直下からの相対パス）
  # リポジトリ直下が Unity プロジェクトなら "."
  PROJECT_DIR_NAME: "."
  # テストを実行するプラットフォーム（PlayMode / EditMode）
  TEST_PLATFORM: "PlayMode"
  # テストアセンブリ名（自分のテストアセンブリ名に変える。複数は ; 区切り）
  TEST_ASSEMBLY_NAMES: "Project.Tests"
  # インポート / テストの制限時間（分、0 で無制限）。過ぎたら run_tests.py が Unity を終了させる
  # 合計にチェックアウトなどの時間を足しても、ジョブのタイムアウト（GitLab の既定は 1 時間）に収まるようにする
  # CICD_IMPORT_TIMEOUT: "30"
  # CICD_TEST_TIMEOUT: "20"
  # shell Runner では作業フォルダが残るので、Library/ などの無視ファイルは消さずに使い回す
  # （既定の -ffdx だと毎回 Library/ が消えてフルインポートになる）
  GIT_CLEAN_FLAGS: "-ffd"

tests_windows:
  stage: test
  tags:
    # Runner に付けたタグに合わせる
    - windows
  rules:
    # develop への push と、画面・API からの手動実行（ブランチ問わず）で動かす
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
  before_script:
    # etc/symlinks.txt があれば、そこに書かれたリンクをジャンクションで作る（無ければ何もしない）
    # 書式: 1行に「リンクのパス|リンク先のパス」（リポジトリ直下からの相対パスか絶対パス。# で始まる行はコメント）
    # （Windows のシンボリックリンクは管理者権限か開発者モードが必要なので、CI では権限のいらないジャンクションで代用する）
    - |
      if (Test-Path "$env:CI_PROJECT_DIR/etc/symlinks.txt") {
        Get-Content "$env:CI_PROJECT_DIR/etc/symlinks.txt" | Where-Object { $_ -and -not $_.StartsWith('#') } | ForEach-Object {
          $link, $src = $_.Split('|')
          $linkPath = Join-Path $env:CI_PROJECT_DIR $link
          $srcPath = if ([System.IO.Path]::IsPathRooted($src)) { $src } else { Join-Path $env:CI_PROJECT_DIR $src }
          if (-not (Test-Path $linkPath)) {
            New-Item -ItemType Junction -Path $linkPath -Target $srcPath | Out-Null
            Write-Host "junction: $link -> $src"
          }
        }
      }
    # Packages/manifest.json で同じ GitLab 上の private な git パッケージを参照している場合に、
    # Unity Package Manager が取得できるよう、このジョブの間だけジョブトークンで認証する（グローバルの git 設定は変えない）
    # ※ 取得先のプロジェクトの『設定 > CI/CD > ジョブトークンの権限』に、このプロジェクトを追加しておくこと
    - $env:GIT_CONFIG_COUNT = "1"
    - $env:GIT_CONFIG_KEY_0 = "url.https://gitlab-ci-token:$($env:CI_JOB_TOKEN)@$($env:CI_SERVER_HOST)/.insteadOf"
    - $env:GIT_CONFIG_VALUE_0 = "https://$($env:CI_SERVER_HOST)/"
  script:
    # tools/ は unity-ci-cd パッケージが Editor 起動時にプロジェクトへコピーしたもの
    # （run_tests.bat は cicd_config.json の runners から name が "Windows" のものを使う）
    - '& "$env:CI_PROJECT_DIR/$env:PROJECT_DIR_NAME/tools/cicd/tests/run_tests.bat" $env:TEST_PLATFORM $env:TEST_ASSEMBLY_NAMES'
  artifacts:
    when: always
    paths:
      - $PROJECT_DIR_NAME/Logs/tests_results.xml
      - $PROJECT_DIR_NAME/Logs/unity_tests.log
      - $PROJECT_DIR_NAME/Logs/unity_import.log
    expire_in: 1 week
